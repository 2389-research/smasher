<div class="token-stat">
    <span class="token-label">IN</span>
    <span class="token-value">{{ input_tokens }}</span>
</div>
<div class="token-stat">
    <span class="token-label">OUT</span>
    <span class="token-value">{{ output_tokens }}</span>
</div>
<div class="token-stat token-total">
    <span class="token-label">TOTAL</span>
    <span class="token-value">{{ input_tokens + output_tokens }}</span>
</div>
