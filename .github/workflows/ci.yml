# ABOUTME: Main CI workflow for smasher workspace — check, test, clippy, fmt, MSRV, docs.
# ABOUTME: Uses Swatinem/rust-cache for Cargo caching and uploads test/lint artifacts.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Reduce debug info in CI to speed up builds and shrink cache
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # ── Fast gate: format check (no build needed) ──────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── Type check (fastest compilation gate) ──────────────────────────
  check:
    name: Check
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-check"
          cache-on-failure: true
      - run: cargo check --workspace

  # ── Tests with structured output and artifact upload ───────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-test"
          cache-on-failure: true
      - name: Run tests and capture output
        run: |
          set -o pipefail
          mkdir -p test-logs
          cargo test --workspace 2>&1 | tee test-logs/full-output.log
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-logs
          path: test-logs/
          retention-days: 14

  # ── Clippy lint with artifact upload ───────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-clippy"
          cache-on-failure: true
      - name: Run clippy and capture output
        run: |
          set -o pipefail
          mkdir -p clippy-logs
          cargo clippy --workspace --message-format=json 2>&1 | tee clippy-logs/clippy-json.log
          cargo clippy --workspace -- -D warnings 2>&1 | tee clippy-logs/clippy-human.log
      - name: Upload clippy logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: clippy-logs
          path: clippy-logs/
          retention-days: 14

  # ── MSRV verification (edition 2024 requires Rust 1.92) ───────────
  msrv:
    name: MSRV (1.92)
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-msrv"
          cache-on-failure: true
      - run: cargo check --workspace
      - run: cargo test --workspace

  # ── Documentation build ────────────────────────────────────────────
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-doc"
          cache-on-failure: true
      - name: Build documentation
        run: |
          set -o pipefail
          cargo doc --workspace --no-deps 2>&1 | tee doc-build.log
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Upload doc build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: doc-build-log
          path: doc-build.log
          retention-days: 14

  # ── Per-crate test report with summary ─────────────────────────────
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-test"
          save-if: false
      - name: Run per-crate test report
        run: bash scripts/ci-test-report.sh test-results
      - name: Upload test result artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results/
          retention-days: 14
