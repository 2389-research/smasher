# ABOUTME: Release workflow triggered by version tags to build cross-platform binaries.
# ABOUTME: Builds for Linux x86_64, macOS x86_64, and macOS aarch64, then publishes a GitHub Release.
name: Release
on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target }}"
          cache-on-failure: true
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p smasher-cli
      - name: Upload release binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: smasher-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/smasher
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for dir in artifacts/smasher-*; do
            target=$(basename "$dir" | sed 's/^smasher-//')
            cp "$dir/smasher" "release-assets/smasher-${target}"
            chmod +x "release-assets/smasher-${target}"
          done
          ls -la release-assets/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
